# Builds the Android app in the cloud, so Android Studio is not needed.
# Use it: upload this whole folder to a free GitHub repository, open the "Actions" tab,
# choose "Build APK", press "Run workflow", then download "MarvelLibrary-apk" from the finished run.
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MarvelLibrary-apk
          path: app/build/outputs/apk/debug/app-debug.apk
