<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cannot connect</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0d;color:#f3f3f6;font:20px system-ui,sans-serif;text-align:center}
main{width:min(640px,92vw)}
h1{margin:0 0 10px;font:900 48px/1 Impact,"Arial Narrow",sans-serif;letter-spacing:.06em;color:#e62429}
p{color:#9b9bab;line-height:1.5;margin:0 0 26px}
button{margin:6px;padding:16px 32px;border:0;border-radius:8px;background:#fff;color:#000;font:600 21px system-ui}
button.alt{background:#2a2a35;color:#fff}
button:focus{outline:4px solid #d4af37;outline-offset:3px}
</style></head><body><main>
<h1>CAN'T REACH YOUR LIBRARY</h1>
<p>Check that the PC is on, the server window is open, and the tunnel link has not changed.</p>
<button id="retry" autofocus>Try again</button><button class="alt" id="set">Change address</button>
</main><script>
document.getElementById('retry').onclick=()=>AndroidApp.retry();
document.getElementById('set').onclick=()=>AndroidApp.settings();
</script></body></html>
