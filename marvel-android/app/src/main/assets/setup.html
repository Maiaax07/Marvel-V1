<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvel Library setup</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 15%,#2a0b0d,#0a0a0d 60%);color:#f3f3f6;font:20px system-ui,sans-serif}
main{width:min(720px,92vw);padding:32px 0}
h1{margin:0 0 6px;font:900 56px/1 Impact,"Arial Narrow",sans-serif;letter-spacing:.08em;color:#e62429}
p{margin:0 0 22px;color:#9b9bab;line-height:1.45}
label{display:block;margin:18px 0 6px;font-weight:600}
input{width:100%;padding:16px 18px;border:2px solid #fff3;border-radius:8px;background:#14141b;color:inherit;font:inherit}
button{margin-top:26px;padding:16px 36px;border:0;border-radius:8px;background:#fff;color:#000;font:600 22px system-ui}
input:focus,button:focus{outline:4px solid #d4af37;outline-offset:3px}
small{display:block;margin-top:6px;color:#9b9bab;font-size:16px}
</style></head><body><main>
<h1>MARVEL LIBRARY</h1>
<p>Enter the address of your library. The app tries the home address first and switches to the internet address when you are away.</p>
<label for="home">Home address (on your Wi-Fi)</label>
<input id="home" type="url" inputmode="url" placeholder="http://192.168.1.20:3000" autocapitalize="off" autocomplete="off">
<small>Optional. Your PC's address on the home network.</small>
<label for="away">Internet address (away from home)</label>
<input id="away" type="url" inputmode="url" placeholder="https://your-link.trycloudflare.com" autocapitalize="off" autocomplete="off">
<small>Optional. The link from the tunnel window on your PC.</small>
<button id="save">Save and open</button>
</main>
<script>
const $=s=>document.getElementById(s);
try{$('home').value=AndroidApp.get('home');$('away').value=AndroidApp.get('away');}catch(e){}
$('save').onclick=()=>{ if(!$('home').value.trim()&&!$('away').value.trim()){alert('Enter at least one address.');return;} AndroidApp.save($('home').value,$('away').value); };
</script></body></html>
